version: "3.9"

services:

  taskflow-db:
    image: postgres:16
    container_name: taskflow-db
    restart: always
    environment:
      POSTGRES_DB: taskflow
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
    volumes:
      - taskflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "taskflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  taskflow-redis:
    image: redis:7
    container_name: taskflow-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  taskflow-ai:
    build: ./AIFastApi
    container_name: taskflow-ai
    ports:
      - "8001:8000"
    depends_on:
      - taskflow-redis
      - taskflow-db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  taskflow-web:
    build: ./OnlineAPI
    container_name: taskflow-web
    ports:
      - "5001:8080"
    depends_on:
      - taskflow-db
      - taskflow-ai
    environment:
      ConnectionStrings__DefaultConnection: Host=taskflow-db;Port=5432;Database=taskflow;Username=taskflow;Password=taskflow
      AI_SERVICE_URL: http://taskflow-ai:8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5

  taskflow-ai-worker:
    build: ./AIFastApi
    container_name: taskflow-ai-worker
    command: celery -A App.tasks.celery_app worker --loglevel=info
    depends_on:
      - taskflow-redis
      - taskflow-ai
    healthcheck:
      test: ["CMD", "curl", "-f", "http://taskflow-ai:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  taskflow_postgres_data:
